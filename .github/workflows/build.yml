name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: brew install just ninja llvm@23

      - name: Build JuceTidy
        run: |
          just configure
          just config=Release test
          just config=Release package

      - name: Store artefacts
        uses: actions/upload-artifact@v5
        with:
          name: JuceTidy
          path: build/package/*.zip
          if-no-files-found: error
